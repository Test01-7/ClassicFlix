# Ajusta dominio, rutas y certificado antes de habilitarlo.
<VirtualHost *:80>
    ServerName cine.ejemplo.com
    Redirect permanent / https://cine.ejemplo.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName cine.ejemplo.com
    DocumentRoot /var/www/Classicflix/Frontend
    SSLEngine on
    SSLCertificateFile /ruta/al/fullchain.pem
    SSLCertificateKeyFile /ruta/al/privkey.pem
    <Directory /var/www/Classicflix/Frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/classicflix-error.log
    CustomLog ${APACHE_LOG_DIR}/classicflix-access.log combined
</VirtualHost>
